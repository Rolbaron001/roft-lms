# Production stack: reverse proxy, application, database.
#
#   docker compose -f docker-compose.production.yml up -d
#
# The application images are built by GitHub Actions and pulled from the
# registry, not compiled here. `next build` needs roughly 2 GB of working
# memory and the production host has under 1 GB, so a deploy that builds on the
# server exhausts memory and stalls indefinitely rather than failing. The
# services carry both an `image:` and a `build:`: the image is what production
# runs, the build block is what makes this file still usable on a machine with
# the memory for it. IMAGE_TAG pins the commit; unset, it means latest.
#
# Only Caddy is exposed to the internet. The application and the database are
# on an internal network with no published ports — a Postgres reachable from
# the internet is the single most common way a small deployment is lost.

name: roft-lms

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Used by the Caddyfile to request the certificate.
      LMS_DOMAIN: ${LMS_DOMAIN:?set LMS_DOMAIN, e.g. lms.roftbusiness.org}
      LMS_TLS_EMAIL: ${LMS_TLS_EMAIL:?set LMS_TLS_EMAIL for certificate notices}
    depends_on:
      - app
    networks:
      - edge

  app:
    # Published by .github/workflows/build-images.yml. The build block below is
    # kept so this file still works on a machine with the memory to compile,
    # but the production deploy never uses it: scripts/auto-deploy.sh pulls
    # this tag and starts with --no-build. See the note at the top of the file.
    image: ghcr.io/rolbaron001/roft-lms-app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The application role: bound by row-level security.
      DATABASE_URL: postgres://roft_app:${ROFT_APP_DB_PASSWORD:?}@db:5432/${POSTGRES_DB:-roft_lms}
      # The owner role: migrations, tenant provisioning, backups.
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-roft_lms}
      ROFT_APP_DB_PASSWORD: ${ROFT_APP_DB_PASSWORD:?}
      # Quoted: the message after :? contains a colon and a space, which YAML
      # would otherwise read as the start of another key.
      AUTH_SECRET: "${AUTH_SECRET:?generate one with npx auth secret}"
      # Seals each person's AI extension token at rest.
      #
      # Optional, and only on this service: nothing else reads or writes a
      # token. Left unset, the key is derived from AUTH_SECRET instead, which
      # works but ties the two together - rotate the session secret and every
      # stored token stops opening. Set it (openssl rand -base64 32) and they
      # rotate independently.
      AI_TOKEN_KEY: ${AI_TOKEN_KEY:-}

      # Outbound mail, and the domain the per-person mailboxes sit on.
      #
      # These were missing from this service entirely, which broke two things
      # quietly rather than loudly. mailIsConfigured() reads MAIL_HOST and
      # MAIL_FROM, so with neither set the application could not send at all -
      # no registration mail, no notifications - while the tools container had
      # them and could, which is why anything sent by a script worked and made
      # the gap look like an intermittent fault. And mailDomainFor() falls back
      # to lms.roftbusiness.org without MAIL_DOMAIN, so Curiosa's people were
      # shown ROFT addresses for their own mailboxes.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${LMS_DOMAIN}}

      AUTH_URL: https://${LMS_DOMAIN:?}
      PLATFORM_HOST: ${LMS_DOMAIN:?}
      # Who operates this deployment. Defaults keep ROFT's instance unchanged;
      # Curiosa's sets its own. See .env.example.
      PLATFORM_ORG_SLUG: ${PLATFORM_ORG_SLUG:-roft}
      PLATFORM_NAME: ${PLATFORM_NAME:-ROFT}
      PLATFORM_REFERENCE_PREFIX: ${PLATFORM_REFERENCE_PREFIX:-ROFT}
      PLATFORM_ILLUSTRATION: ${PLATFORM_ILLUSTRATION:-}
      # Evidence on this server's disk until a bucket exists. Switching to
      # "s3" moves it without a rebuild — and changes what the nightly backup
      # covers, which backup.sh says out loud when it runs.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      # Evidence uploads must outlive the container. Losing these loses the
      # Portfolio of Evidence behind every assessment decision.
      - evidence:/app/storage
      # The AI extension's sign-in, if anybody ever completes one. Without this
      # a redeploy would sign the platform out silently, and the next person to
      # use it would be told the extension is unavailable with no explanation
      # of what changed.
      - claude:/home/nextjs/.claude
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - internal

  # One-shot container for migrations, seeding, backups and notifications.
  #
  # Not started with the stack — `profiles` keeps it out of `up`. Run it with:
  #   docker compose -f docker-compose.production.yml run --rm tools <command>
  #
  # It exists because the application image deliberately contains only the
  # built app: no source, no dev dependencies, no scripts directory.
  tools:
    image: ghcr.io/rolbaron001/roft-lms-tools:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    profiles: ["tools"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://roft_app:${ROFT_APP_DB_PASSWORD:?}@db:5432/${POSTGRES_DB:-roft_lms}
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-roft_lms}
      ROFT_APP_DB_PASSWORD: ${ROFT_APP_DB_PASSWORD:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_URL: https://${LMS_DOMAIN:?}
      PLATFORM_HOST: ${LMS_DOMAIN:?}
      # Who operates this deployment. Defaults keep ROFT's instance unchanged;
      # Curiosa's sets its own. See .env.example.
      PLATFORM_ORG_SLUG: ${PLATFORM_ORG_SLUG:-roft}
      PLATFORM_NAME: ${PLATFORM_NAME:-ROFT}
      PLATFORM_REFERENCE_PREFIX: ${PLATFORM_REFERENCE_PREFIX:-ROFT}
      PLATFORM_ILLUSTRATION: ${PLATFORM_ILLUSTRATION:-}
      # Evidence on this server's disk until a bucket exists. Switching to
      # "s3" moves it without a rebuild — and changes what the nightly backup
      # covers, which backup.sh says out loud when it runs.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Used by scripts/backup.sh when run through this container.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:-roft_lms}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_DIR: /backups
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Or a script would propose a different address to the one the
      # application shows for the same person.
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${LMS_DOMAIN}}
    volumes:
      - evidence:/app/storage
      # Backups land on the host so they survive the container and can be
      # copied off the machine.
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # Inbound mail. Its own container, so a bug in mail handling cannot take the
  # application down and the process facing the internet on port 25 holds no
  # more than it needs.
  #
  # Port 25 inbound is unaffected by Oracle's outbound block: that stops this
  # machine connecting *out* on 25, not other servers connecting *in*.
  mail:
    image: ghcr.io/rolbaron001/roft-lms-tools:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/mail-receiver.mts"]
    ports:
      - "25:25"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://roft_app:${ROFT_APP_DB_PASSWORD:?}@db:5432/${POSTGRES_DB:-roft_lms}
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-roft_lms}
      ROFT_APP_DB_PASSWORD: ${ROFT_APP_DB_PASSWORD:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      PLATFORM_HOST: ${LMS_DOMAIN:?}
      # Who operates this deployment. Defaults keep ROFT's instance unchanged;
      # Curiosa's sets its own. See .env.example.
      PLATFORM_ORG_SLUG: ${PLATFORM_ORG_SLUG:-roft}
      PLATFORM_NAME: ${PLATFORM_NAME:-ROFT}
      PLATFORM_REFERENCE_PREFIX: ${PLATFORM_REFERENCE_PREFIX:-ROFT}
      PLATFORM_ILLUSTRATION: ${PLATFORM_ILLUSTRATION:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${LMS_DOMAIN}}
      # Evidence on this server's disk until a bucket exists. Switching to
      # "s3" moves it without a rebuild — and changes what the nightly backup
      # covers, which backup.sh says out loud when it runs.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      # Attachments are stored the same way evidence is, in the same place.
      - evidence:/app/storage
      # Caddy's certificates, read-only, so STARTTLS presents a real one
      # instead of smtp-server's built-in certificate whose private key is
      # publicly known. Renewal is Caddy's job and needs nothing here.
      - caddy_data:/caddy:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - internal

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-roft_lms}
      # Sensible defaults for South African tenants; per-tenant display
      # formatting is handled in the application, not here.
      TZ: Africa/Johannesburg
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data.
      #
      # Postgres 18 changed this. The data now lives in a version-numbered
      # subdirectory, so mounting the old path leaves the actual data inside
      # the container — the image detects that and refuses to start rather than
      # letting you run a database that quietly loses everything on redeploy.
      # Mounting the parent is also what makes a future pg_upgrade possible.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-roft_lms}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    # No published ports on purpose. Reach it with:
    #   docker compose -f docker-compose.production.yml exec db psql -U postgres

networks:
  edge:
  internal:
    internal: true

volumes:
  # Holds nothing until somebody signs the AI extension in, and is harmless
  # empty. See the note on the app service.
  claude:
  pgdata:
  evidence:
  caddy_data:
  caddy_config:
