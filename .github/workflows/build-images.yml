# Builds the application images and publishes them to the GitHub Container
# Registry, so that no server ever has to compile this application.
#
# Why this exists: `next build` wants somewhere between 1.5 and 2 GB of working
# memory. The production host has 929 MB. Building there did not fail with an
# error, which would at least have been honest -- it exhausted memory, consumed
# the whole of swap, and then carried on at a load average of ten on a single
# processor without making progress. A deploy that never finishes is worse than
# one that stops, because nothing alerts on it.
#
# So the compile happens here, where memory is free and plentiful, and the
# server's deploy becomes a pull of a finished image. That also makes deploys
# considerably faster and stops a deploy from taking the running site down with
# it by starving it of memory.

name: Build and publish images

on:
  push:
    branches: [main]
  # Lets a rebuild be triggered by hand from the Actions tab, which is useful
  # when a deploy needs redoing without an empty commit to force it.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercased deliberately: the registry rejects capitals in an image name,
  # and the account is spelled with them.
  IMAGE_BASE: ghcr.io/rolbaron001/roft-lms

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to the registry as the workflow's own token, so no
      # personal access token is needed for publishing.
      packages: write

    strategy:
      # Both images come from the same Dockerfile at different targets. They are
      # built as separate jobs so that one failing is legible on its own, and so
      # they share the layer cache rather than rebuilding dependencies twice.
      matrix:
        include:
          - target: runtime
            suffix: app
          - target: tools
            suffix: tools

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.suffix }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # Two tags on every image: the commit it was built from, which is what
          # a deploy pins itself to and what makes a rollback a one-word change,
          # and "latest", which is what a first-time deploy reaches for.
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.suffix }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-${{ matrix.suffix }}:latest
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
